<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="win-tiler icon">
  <defs>
    <linearGradient id="tileTop" x1="34" y1="36" x2="222" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36c5f0"/>
      <stop offset="1" stop-color="#0b6ec7"/>
    </linearGradient>
    <linearGradient id="tileBottom" x1="34" y1="36" x2="222" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21d07a"/>
      <stop offset="1" stop-color="#087f5b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#06213a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="#0b1726"/>
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="88" height="88" fill="url(#tileTop)"/>
    <rect x="134" y="34" width="88" height="88" fill="#6c5ce7"/>
    <rect x="34" y="134" width="88" height="88" fill="url(#tileBottom)"/>
    <rect x="134" y="134" width="88" height="88" fill="#ffb020"/>
  </g>
</svg>
