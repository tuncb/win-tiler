name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01'

      - name: Integrate vcpkg
        run: vcpkg integrate install

      - name: Build Release
        run: msbuild win-tiler.slnx /p:Configuration=Release /m

      - name: Package Release
        run: |
          New-Item -ItemType Directory -Path release-package | Out-Null
          Copy-Item x64\Release\win-tiler.exe release-package\
          $runtime_dlls = Get-ChildItem x64\Release\fmt*.dll -ErrorAction SilentlyContinue
          if ($runtime_dlls) {
            Copy-Item $runtime_dlls -Destination release-package\
          }
          Compress-Archive -Path release-package\* -DestinationPath win-tiler-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: win-tiler-${{ github.ref_name }}.zip
          generate_release_notes: true
