name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01'

      - name: Integrate vcpkg
        run: vcpkg integrate install

      - name: Build Release
        run: msbuild win-tiler.slnx /p:Configuration=Release /m

      - name: Package Release
        run: |
          $assetName = "win-tiler-${{ github.ref_name }}.exe"
          Copy-Item x64\Release\win-tiler.exe $assetName
          $hash = (Get-FileHash -Algorithm SHA256 $assetName).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii "$assetName.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            win-tiler-${{ github.ref_name }}.exe
            win-tiler-${{ github.ref_name }}.exe.sha256
          generate_release_notes: true
